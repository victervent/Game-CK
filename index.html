<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Bull Run Tycoon</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#e9edf8;--cd:rgba(255,255,255,.78);--tx:#121833;--mu:#566091;--ac:#d9a21b;--up:#0e9f6e;--v:#5b3df5;--rd:#e0264b;--ln:rgba(18,24,51,.12);--o1:rgba(91,61,245,.2);--o2:rgba(217,162,27,.22);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#080c1c;--cd:rgba(22,30,60,.62);--tx:#e9edff;--mu:#8f99c0;--ac:#f5c451;--up:#35d9a1;--v:#8b6dff;--rd:#ff5472;--ln:rgba(255,255,255,.1);--o1:rgba(139,109,255,.3);--o2:rgba(245,196,81,.16)}}
:root[data-theme=dark]{--bg:#080c1c;--cd:rgba(22,30,60,.62);--tx:#e9edff;--mu:#8f99c0;--ac:#f5c451;--up:#35d9a1;--v:#8b6dff;--rd:#ff5472;--ln:rgba(255,255,255,.1);--o1:rgba(139,109,255,.3);--o2:rgba(245,196,81,.16)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 'Be Vietnam Pro',system-ui,sans-serif}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(620px 420px at 12% 8%,var(--o1),transparent),radial-gradient(520px 420px at 88% 25%,var(--o2),transparent);animation:dr 14s ease-in-out infinite alternate}
@keyframes dr{to{transform:scale(1.18) translate(2%,3%)}}
#app{max-width:1180px;margin:auto;padding:14px;display:grid;gap:12px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:14px;backdrop-filter:blur(14px);box-shadow:0 14px 40px -22px #000}
h3{margin:0 0 10px;font-size:14px}h3 small{color:var(--mu);font-weight:400;margin-left:6px}
.hd{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.br{font-weight:800;font-size:20px;letter-spacing:.5px}.br b{color:var(--ac)}
.ttl{font-weight:800;padding:7px 18px;border-radius:99px;color:#241a00;background:linear-gradient(100deg,var(--ac) 30%,#fff8 50%,var(--ac) 70%);background-size:220% 100%;animation:sh 3s linear infinite,gl 2s ease-in-out infinite alternate}
@keyframes gl{from{box-shadow:0 0 10px -2px var(--ac)}to{box-shadow:0 0 30px 0 var(--ac)}}
.ct{display:flex;gap:6px;align-items:center}.ct span{font-weight:600;margin-right:6px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--cd);border-radius:12px;padding:8px 12px;transition:.2s}
button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--ac);box-shadow:0 8px 22px -10px var(--ac)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.ct button.on,.tb.on{background:var(--v);color:#fff;border-color:transparent}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.st small{color:var(--mu);display:block}.st b{font-size:22px;font-weight:800;display:block;font-variant-numeric:tabular-nums}.st em{font-style:normal;color:var(--mu);font-size:12px}
#pc.up b{color:var(--up)}#pc.dn b{color:var(--rd)}
main{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.L{display:grid;gap:12px;min-width:0}
canvas{width:100%;height:240px;display:block}
.rw{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:9px}.rw i{width:9px;height:9px;border-radius:50%}.rw span{flex:1}.rw u{text-decoration:none;color:var(--mu);width:14px}
.rw.me{background:linear-gradient(90deg,var(--o2),transparent);font-weight:600}
.mt label{display:flex;justify-content:space-between;font-weight:600}
.bar{height:10px;border-radius:9px;background:var(--ln);overflow:hidden;margin:5px 0 13px}
.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width .6s;background:linear-gradient(90deg,var(--up),var(--v),var(--up));background-size:200% 100%;animation:sh 2.5s linear infinite}
.bar.r i{background:linear-gradient(90deg,var(--ac),var(--rd),var(--ac));background-size:200% 100%}
.bar.g i{background:linear-gradient(90deg,var(--ac),var(--v),var(--ac));background-size:200% 100%}
.bar.hot{animation:pl .6s infinite alternate}
@keyframes sh{to{background-position:-220% 0}}@keyframes pl{to{box-shadow:0 0 16px var(--rd)}}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tb{flex:1;padding:8px 4px}
.pn{display:none}.pn.on{display:block}
.act{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin-bottom:8px}
.act i{font-style:normal;font-size:22px}.act span{flex:1}.act small{display:block;color:var(--mu)}.act em{font-style:normal;color:var(--ac)}
.act.bad:hover:not(:disabled){border-color:var(--rd);box-shadow:0 8px 22px -10px var(--rd)}
#lg p{margin:0;padding:6px 0;border-bottom:1px solid var(--ln);font-size:13px}#lg p:first-child{animation:in .4s}
#ac{display:flex;flex-wrap:wrap;gap:8px}
.bd{display:flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;border:1px dashed var(--ln);opacity:.45;filter:grayscale(1)}
.bd.on{opacity:1;filter:none;border:1px solid var(--ac);box-shadow:0 0 16px -4px var(--ac)}
#ts{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:8px;z-index:60;max-width:min(340px,calc(100vw - 24px))}
.t{padding:10px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);box-shadow:0 10px 30px -10px #000;animation:in .4s}
.t.bad{border-color:var(--rd)}.t.big{border-color:var(--ac);box-shadow:0 0 34px -6px var(--ac);font-size:16px}
@keyframes in{from{opacity:0;transform:translateX(30px)}}
.bs{position:fixed;font-size:26px;pointer-events:none;z-index:50;animation:fly 1.5s ease-out var(--d) forwards}
@keyframes fly{0%{transform:scale(.5);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.3) rotate(360deg);opacity:0}}
#ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,8,20,.72);backdrop-filter:blur(8px);z-index:40;padding:16px}#ov.on{display:grid}
.bx{max-width:420px;width:100%;text-align:center;background:var(--bg);border:1px solid var(--ac);border-radius:22px;padding:26px;box-shadow:0 0 60px -12px var(--ac)}
.bx h1,.bx h2{margin:0 0 8px}.bx h1 b{color:var(--ac)}.bx p{color:var(--mu)}
.bx input{width:100%;font:inherit;color:inherit;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center;margin:6px 0 12px}
.go{width:100%;background:linear-gradient(100deg,var(--ac),var(--v));color:#fff;font-weight:800;border:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mc div{text-align:center;padding:8px;border-radius:12px;background:var(--ln)}.mc small{display:block;color:var(--mu)}.mc b{font-size:18px}
#ph{font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 2px #0006;padding:2px 10px;border-radius:99px;margin-left:8px}.tb{font-size:12.5px;padding:8px 2px}.bx .act{margin:10px 0 0}
#pb{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;padding:10px 20px;border-radius:99px;background:var(--bg);border:1px solid var(--ac);font-weight:600;text-align:center;animation:gl 1.5s ease-in-out infinite alternate}.ps #pb{display:block}.ps .hd{border-color:var(--ac)}.ps #dy::after{content:' ⏸'}
.tabs{flex-wrap:wrap}.tb{flex:1 1 30%}.ar{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--ln)}.ar b{text-align:right}#p4 h4{margin:14px 0 4px;font-size:13px;color:var(--ac)}.sk{display:flex;height:12px;border-radius:9px;overflow:hidden;margin:6px 0}.sk i{display:block}
.bx select{width:100%;font:inherit;color:inherit;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:12px}option{background:var(--bg)}
</style></head><body>
<div class="bg"></div>
<div id="app">
<header class="cd hd"><div class="br">📈 BULL<b>RUN</b> Tycoon</div><div id="ttl" class="ttl"></div><div class="ct"><span id="dy"></span><button id="pz" data-p="1" title="Tạm dừng (Space)">⏸</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div></header>
<section class="st">
<div class="cd"><small>Tiền mặt</small><b id="s0"></b><em id="s0b"></em></div>
<div class="cd"><small id="vl">Định giá</small><b id="s1"></b><em id="s1b"></em></div>
<div class="cd" id="pc"><small>Giá cổ phiếu</small><b id="s2"></b><em id="s2b"></em></div>
<div class="cd"><small>Nợ vay</small><b id="s4"></b><em id="s4b"></em></div>
<div class="cd"><small>Sở hữu của bạn</small><b id="s3"></b><em id="s3b"></em></div>
</section>
<main><div class="L">
<div class="cd"><h3>Cuộc đua vốn hóa<small>thang log, 120 ngày gần nhất</small></h3><canvas id="cv"></canvas><div id="lb"></div></div>
<div class="cd"><h3>Vĩ mô<span id="ph"></span></h3><div class="mc"><div><small>Lãi suất</small><b id="x0"></b></div><div><small>Lạm phát</small><b id="x1"></b></div><div><small>Tăng trưởng GDP</small><b id="x2"></b></div></div><small id="xh" style="color:var(--mu);display:block;margin-top:8px"></small></div>
<div class="cd mt"><label>🤝 Niềm tin nhà đầu tư <b id="m0"></b></label><div class="bar"><i id="b0"></i></div>
<label>🕵️ Thanh tra để mắt tới <b id="m1"></b></label><div class="bar r" id="br1"><i id="b1"></i></div>
<label>🏅 Tiến tới danh hiệu kế tiếp <b id="m2"></b></label><div class="bar g"><i id="b2"></i></div></div>
<div class="cd"><h3>Bản tin thị trường</h3><div id="lg"></div></div>
</div>
<div class="cd"><div class="tabs"><button class="tb on" data-t="0">🏗️ Phát triển</button><button class="tb" data-t="1">🏦 Sàn</button><button class="tb" data-t="2">🦈 Thao túng</button><button class="tb" data-t="3">💳 Vốn</button><button class="tb" data-t="4">📊 Phân tích</button></div>
<div class="pn on" id="p0"></div><div class="pn" id="p1"></div><div class="pn" id="p2"></div><div class="pn" id="p3"></div><div class="pn" id="p4"></div></div></main>
<div class="cd"><h3>Thành tích</h3><div id="ac"></div></div>
</div>
<div id="pb">⏸ Đang tạm dừng · bấm ▶ hoặc phím Space để chạy tiếp</div><div id="ts"></div><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),R=Math.random,cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const fm=v=>v>=1e6?(v/1e6).toFixed(2)+' nghìn tỷ':v>=1e3?(v/1e3).toFixed(1)+' tỷ':Math.round(v)+' tr';
const TT=[[0,'Tiểu thương','🧺'],[3e3,'Chủ startup','🚀'],[2e4,'Doanh nhân','💼'],[1.5e5,'Đại gia sàn','📈'],[8e5,'Tỷ phú','💎'],[3e6,'Cá mập phố Wall','🦈'],[1e7,'Hoàng đế tài chính','👑']];
const UP=[['Sản phẩm','🧪',300,12],['Marketing','📣',400,16],['Nhân sự','👥',600,24],['Chi nhánh','🏢',1500,70],['Pháp chế','⚖️',800,0]];
const RV=[['VinaTech','VNT','#ff9f43',4000,.0015,0],['Sao Mai Group','SMG','#54a0ff',15000,.0012,1],['Rồng Việt','RVG','#ff6b9d',60000,.001,3],['Hoàng Long','HLR','#feca57',9000,.0014,1],['Đại Nam Energy','DNE','#1dd1a1',28000,.001,2],['An Phát Pharma','APP','#a29bfe',3000,.0016,4],['Số Hóa Việt','SHV','#00d2d3',20000,.0013,0],['Tân Á Bank','TAB','#ff7675',45000,.0011,3]];
const AC=[['Lên sàn','🔔',g=>g.ls],['Cổ tức đầu tiên','💵',g=>g.dv>0],['Soán ngôi số 1','🥇',g=>g.ls&&g.rk==1],['Cá mập: 5 lần thao túng','🦈',g=>g.mn>=5],['Sống sót sau thanh tra','🛡️',g=>g.au>0],['Sạch như nước cất','🧼',g=>g.ls&&g.d>=150&&!g.mn],['Giá gấp 3 lần IPO','📊',g=>g.ls&&g.p>=g.p0*3],['Nghìn tỷ vốn hóa','💰',g=>g.v>=1e6]];
const AB=[[1,'ipo','🔔','Niêm yết (IPO)','Bán 30% cổ phần khi định giá từ 5 tỷ'],[1,'div','💵','Chia cổ tức','−10% tiền mặt, nhà đầu tư vui'],[1,'bb','🔁','Mua lại cổ phiếu','−15% tiền mặt, giá tăng, nắm thêm quyền'],[1,'iss','📦','Phát hành thêm','Huy động vốn, nhưng loãng cổ phần'],
[2,'rum','📢','Tung tin đồn tốt','Hype ngắn hạn · rủi ro +12'],[2,'wash','🎯','Đẩy giá bằng giao dịch ảo','Giá +5% ngay · rủi ro +15'],[2,'cook','📑','Làm đẹp báo cáo','Lợi nhuận “ảo” ×1.5 trong 30 ngày · rủi ro +18'],[2,'sm','🕳️','Bôi nhọ đối thủ','Đối thủ mạnh nhất −12% · rủi ro +10'],[2,'br','💰','Lobby thanh tra','Rủi ro −25 · 20% bị bại lộ']];
const EV=[['📰 Báo chí khen ngợi bạn',g=>g.tr+=10],['⚠️ Tin đồn xấu lan trên diễn đàn',g=>{g.tr-=12;g.hy-=.05}],['🤝 Ký được hợp đồng lớn',g=>g.cash+=prof(g)*20],['💥 Sự cố sản phẩm, tốn tiền khắc phục',g=>g.cash-=Math.min(g.cash*.3,prof(g)*25)],['🌪️ Khủng hoảng kinh tế, thị trường giảm sâu',g=>{g.tn=-.007;g.tc=18}],['🚀 Chính phủ kích cầu, thị trường tăng mạnh',g=>{g.tn=.006;g.tc=18}],['🕵️ Đối thủ tố cáo bạn lên thanh tra!',g=>g.su+=g.su>15?14:4]];
let G,sp=1,tm,pz=0;
const IND=[['Công nghệ','💻',1.2,1.5,.6,1.3,'tăng nhanh, nhạy lãi suất'],['Bán lẻ','🛒',1.5,.8,1.3,.9,'nhạy GDP và lạm phát'],['Năng lượng','⛽',.8,.8,.5,1.1,'chịu được lạm phát'],['Tài chính','🏦',.9,.5,.8,1.2,'ít nhạy lãi suất'],['Y tế','💊',.5,.7,.6,.7,'phòng thủ, ít biến động']];
const RT=[['AAA',0],['AA',.5],['A',1],['BBB',2],['BB',3.5],['B',5],['CCC',8]],rt=g=>{const k=100-g.debt/Math.max(300,g.v)*90-(ebit(g)<0?35:0)-g.su/4-(g.cash<0?25:0);return RT[k>=90?0:k>=80?1:k>=70?2:k>=60?3:k>=50?4:k>=35?5:6]};
const rev=g=>(10+UP.reduce((s,u,i)=>s+u[3]*(Math.pow(1.38,g.lv[i])-1)/.38,0)+g.ma)*(1+(g.gdp-4)/30*IND[g.ix][2])*(g.pw>0?.75:1)*(g.st>0?.7:1)*(g.bf>0?1.2:1)*(g.cm>0?1.15:1)*(g.rd>0?1.25:1)*(g.bd>0?.85:1)*cl(1+(g.ms-g.msf)*.6,.8,1.3),
cost=g=>rev(g)*(.46+g.inf/250*IND[g.ix][4])*(g.cc>0?.85:1)*(g.sc>0?1.12:1)+3+2*g.lv.reduce((a,b)=>a+b,0),ebit=g=>rev(g)-cost(g),
net=g=>{const e=ebit(g);return e-Math.max(0,e)*.2-g.debt*(g.ir+rt(g)[1])/4500},prof=g=>Math.max(0,net(g)),pe=g=>2000/(g.ir*IND[g.ix][3]+5),
val=g=>g.ls?g.p*g.sh:Math.max(300,net(g)*pe(g)+g.cash-g.debt),uc=i=>Math.round(UP[i][2]*Math.pow(1.6,G.lv[i])*(1+G.inf/60));
const lg=m=>G.lgs.unshift(`Ngày ${G.d} · ${m}`);
function toast(m,c){const e=document.createElement('div');e.className='t '+(c||'');e.innerHTML=m;$('#ts').prepend(e);setTimeout(()=>e.remove(),4500)}
function burst(s){for(let i=0;i<22;i++){const e=document.createElement('span');e.className='bs';e.textContent=s;e.style.cssText=`--x:${(R()-.5)*90}vw;--y:${-30-R()*60}vh;--d:${R()*.4}s;left:50%;top:70%`;document.body.append(e);setTimeout(()=>e.remove(),2000)}}
function ov(h){$('#ov').innerHTML=h;$('#ov').className='on'}
function start(){ov('<div class="bx"><h1>📈 BULL<b>RUN</b></h1><p>Từ tiểu thương lên sàn chứng khoán. Vượt đối thủ, giữ chân nhà đầu tư, thao túng nếu dám, và đừng để thanh tra gõ cửa.</p><input id="nm" maxlength="22" value="Công ty của bạn"><select id="ind">'+IND.map((x,i)=>'<option value="'+i+'">'+x[1]+' '+x[0]+' · '+x[6]+'</option>').join('')+'</select><button class="go" id="go">Khởi nghiệp</button></div>')}
function end(t,m){G.over=1;ov(`<div class="bx"><h2>💀 ${t}</h2><p>${m}</p><p>Sống sót ${G.d} ngày · ${TT[G.ti][2]} ${TT[G.ti][1]} · đỉnh ${fm(G.pk)}</p><button class="go" id="rs">Chơi lại</button></div>`)}
function init(n,ix){clearTimeout(tm);G={ix:ix|0,v:1e3,cm:0,cc:0,rd:0,bd:0,sc:0,ms:.25,msf:.25,ret:0,fv:1,n:n.replace(/[<>&]/g,'')||'Công ty',d:0,cash:800,lv:[0,0,0,0,0],ls:0,p:0,p0:1,sh:5000,own:1,tr:50,su:0,hy:0,tn:.002,tc:20,mn:0,au:0,dv:0,dcd:0,cook:0,ti:0,lo:0,over:0,pf:0,nt:0,pk:0,rk:4,ac:{},lgs:[],w1:0,lp:0,debt:0,ma:0,mq:0,pw:0,st:0,bf:0,ng:0,sv:0,md:0,ph:0,pd:70,ir:4,inf:2,gdp:3,rv:RV.map(r=>({n:r[0],t:r[1],c:r[2],v:r[3],m:r[4],i:r[5],h:[r[3]]}))};G.v=val(G);G.h=[G.v];$('#ov').className='';setP(0);lg('Khai trương '+IND[G.ix][1]+' '+G.n+'. Chi phí cố định, thuế 20% và lạm phát sẽ ăn dần lợi nhuận.');render();loop()}
function loop(){clearTimeout(tm);if(!pz&&sp&&G&&!G.over&&!G.md)tm=setTimeout(()=>{tick();loop()},3000/sp)}
const PH=[['Phục hồi',4,2,3,.002,'Vay rẻ, cầu hồi dần: lúc hợp để mở rộng'],['Tăng trưởng',5.5,3,6.5,.002,'Doanh thu tăng, đối thủ cũng mạnh lên'],['Bong bóng',8,6,7,.004,'Giá nóng, lãi suất và lạm phát cao: coi chừng vỡ bong bóng'],['Suy thoái',6,4,-1.5,-.005,'Cầu giảm: giữ tiền mặt, tránh vay nợ']];

/* Sơ đồ tổ chức + bảng quan hệ */

[0,1,2].forEach(i=>{$('#rl'+i).textContent=Math.round(g.rl[i])+'/100';$('#rb'+i).style.width=g.rl[i]+'%'});

$('#hs').textContent=tot+' người';$('#hse').textContent='Lương '+fm(py)+'/tháng · kỳ tới '+nx+' ngày';
if(!$('#p6'))return;

+['Giám đốc điều hành','Giám đốc tài chính','Giám đốc pháp chế'].map((n,i)=>`<div class="ogn${E[i]?'':' off'}"><b>${['🧑‍💼','💹','⚖️'][i]}</b><small>${n}</small><em>${E[i]?'⭐'.repeat(E[i]):'Trống'}</em></div>`).join('')
+'</div><div class="oc"></div><div class="or d4">'
+DP.map((d,i)=>{const f=g.hc[i]/nn[i],c=f<.7?'rd':f>1.1?'ac':'up',w=W[i]*kk;return `<div class="ogn"><b>${d[1]} ${d[0]}</b><small>${g.hc[i]} / ${nn[i]} người · ${fm(w)}/người/tháng</small><div class="bar"><i style="width:${Math.min(100,f*100)}%;animation:none;background:var(--${c})"></i></div><div class="bt">${bt('fi'+i,'−1',g.hc[i]<=1)}${bt('hi'+i,'+1',g.cash<w)}${bt('fl'+i,'Đủ',nn[i]<=g.hc[i]||g.cash<w)}</div></div>`}).join('')
+'</div></div>'
+rw('Tổng nhân sự',tot+' người')+rw('Lương tháng',fm(py)+' · trả sau '+nx+' ngày')+rw('Hiệu suất nhân sự',Math.round(av*100)+'%',av<.7?'rd':'up')+rw('Thiếu người (dưới 50%) thì nhân viên nghỉ việc, dư người thì chỉ tốn lương','')
+'<h4>🧧 Chăm sóc và quan hệ</h4>'
+`<button class="act" data-a="bonus"${g.cash<py*.5?' disabled':''}><i>🧧</i><span><b>Thưởng nóng cho nhân viên</b><small>Năng suất +10% trong 30 ngày${g.bo>0?' · còn '+g.bo+' ngày':''}</small></span><b>${fm(py*.5)}</b></button>`
+RA.map(a=>`<button class="act" data-a="${a[0]}"${g.cash<r*a[4]?' disabled':''}><i>${a[1]}</i><span><b>${a[2]}</b><small>${a[3]}</small></span><b>${fm(r*a[4])}</b></button>`).join('');
$('#p6').innerHTML=h}
const _r=render;render=function(){if(G)zi(G);_r();zo()};

g.rl=g.rl.map(v=>cl(v+(50-v)*.008,0,100));
g.tr=cl(g.tr+(g.rl[0]-50)*.004,0,100);g.su=cl(g.su-(g.rl[1]-50)*.004,0,100);

g.hc.forEach((h,i)=>{const f=h/nn[i];g.cash+=r*CR[i]*Math.min(1.1,f)*(g.bo>0?1.1:1);if(i==3)g.su=Math.max(0,g.su-.06*Math.min(1,f));if(f<.5&&R()<.02){g.hc[i]=Math.max(1,Math.floor(h*.9));g.tr-=3;lg('😤 '+DP[i][0]+' quá tải, nhân viên nghỉ việc')}});
if(g.bo>0)g.bo--;
if(g.d%30==0){const p=pay(g);g.cash-=p;lg('💸 Trả lương tháng '+fm(p)+' cho '+g.hc.reduce((a,b)=>a+b,0)+' nhân sự')}
if(!g.md)sv2();render()};

['🏛️ Cơ quan quản lý đề nghị kiểm tra tự nguyện','Chấp nhận: tốn 5 ngày lợi nhuận, quản lý +12, rủi ro −6','Từ chối: quản lý −10',g=>{g.cash-=prof(g)*5;rl(1,12);g.su=Math.max(0,g.su-6)},g=>rl(1,-10)]);
